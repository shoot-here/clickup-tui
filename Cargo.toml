[package]
name = "clickup-tui"
version = "0.1.0"
edition = "2021"
description = "Yazi-style terminal client for ClickUp — read, edit, search, filter, and visualize your workspace without leaving the terminal."
license = "MIT"
repository = "https://github.com/shoot-here/clickup-tui"
homepage = "https://github.com/shoot-here/clickup-tui"
readme = "README.md"
keywords = ["clickup", "tui", "ratatui", "productivity", "terminal"]
categories = ["command-line-utilities"]
authors = ["shoot-here"]

[[bin]]
name = "clickup"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
dirs = "5"
futures = "0.3"
tui-textarea = "0.7"
chrono = { version = "0.4", default-features = false, features = ["std", "alloc", "clock"] }

[profile.release]
lto = "thin"
strip = true
